name: OmniAgentCS CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXUS_E2E: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # El gate de tipado es incremental: necesita la base del PR/push.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-dev.txt
            requirements-prod.in
            nexus_core/requirements.txt
      # SEC-10: the lock fixes every version and hash, so two builds of the same
      # commit install the same bytes. Regenerate it with `make lock` when the
      # requirements change.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: make syntax lint test
      - name: Audit dependencies (SEC-11, no bloqueante al inicio)
        # Staged rollout from the 2026-10-23 audit: it reports without failing
        # the build while the known advisory below has no fix. It is NOT green:
        # paramiko 3.5.1 carries PYSEC-2026-2858 with no fixed release yet, and
        # paramiko backs nexus.post.* (ssh_exec / enum_system).
        continue-on-error: true
        run: pip-audit -r requirements-dev.lock --progress-spinner off
      - name: Typecheck changed Python files (V1-9)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          make typecheck TYPECHECK_BASE="$BASE"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus-ci-password@127.0.0.1:5432/nexus
      NEXUS_TEST_PG_DSN: postgresql://nexus:nexus-ci-password@127.0.0.1:5432/nexus
      NEXUS_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: make test-postgres
      - run: python -m pytest nexus_core/tests/integration/test_kernel_concurrency.py -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
