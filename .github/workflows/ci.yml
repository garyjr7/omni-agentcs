name: OmniAgentCS CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXUS_E2E: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # El gate de tipado es incremental: necesita la base del PR/push.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-dev.txt
            requirements-prod.in
            nexus_core/requirements.txt
      - name: Install system dependencies
        # The egress tests build the real bwrap/socat/proxychains argv; the
        # ubuntu-latest image ships none of them. nmap stays out on purpose:
        # its network test skips when the binary is absent.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat proxychains4
      # SEC-10: the lock fixes every version and hash, so two builds of the same
      # commit install the same bytes. Regenerate it with `make lock` when the
      # requirements change.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: make syntax lint test
      - name: Audit dependencies (SEC-11, bloqueante)
        # Blocking as of 3.0.0b1. The one accepted advisory is paramiko's
        # PYSEC-2026-2858 (no fixed release yet), ignored in the `make audit`
        # target and justified in SECURITY.md §4.1. pyasn1 is no longer an
        # exception: it is pinned >=0.6.5, which fixes CVE-2026-119194…119197.
        # An exception that stops being true has to break this job, not hide.
        run: make audit
      - name: Typecheck changed Python files (V1-9)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          make typecheck TYPECHECK_BASE="$BASE"
      - name: Typecheck security core (V1-9, estricto y bloqueante)
        # No diff base: kernel, tools and scope are checked in full on every
        # push/PR. It reports 0 errors in 181 files (2026-11-10); if it goes
        # red, the release does not ship.
        run: make typecheck-strict

  coverage:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXUS_E2E: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install system dependencies
        # Same binaries as the cli job: coverage runs the same suite and must
        # not fail (or silently skip) for a missing runner package.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat proxychains4
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Coverage gate (V1-12)
        # The floor is the measurement documented in the Makefile (86.2 % on
        # 2026-11-06), not a target: it is a ratchet, so a change that lowers
        # coverage fails instead of passing silently. Here it runs in one go;
        # the dev box only needs the chunking because it has 3.8 GB of RAM.
        run: make test-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus-ci-password@127.0.0.1:5432/nexus
      NEXUS_TEST_PG_DSN: postgresql://nexus:nexus-ci-password@127.0.0.1:5432/nexus
      NEXUS_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: make test-postgres
      - run: python -m pytest nexus_core/tests/integration/test_kernel_concurrency.py -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
