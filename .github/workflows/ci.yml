name: NEXUS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: make syntax
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make test-api
      - run: make test-mcp
      - run: pip-audit -r requirements-prod.lock

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus_frontend/package-lock.json
      - run: npm ci
        working-directory: nexus_frontend
      - run: npm run lint
        working-directory: nexus_frontend
      - run: npm run build
        working-directory: nexus_frontend

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus-ci-password@127.0.0.1:5432/nexus
      NEXUS_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: make test-postgres

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: nexus-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          load: true
          tags: nexus-frontend:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nexus-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: anchore/sbom-action@v0
        with:
          image: nexus-backend:ci
          artifact-name: nexus-backend.spdx.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
