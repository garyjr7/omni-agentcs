[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagentcs"
version = "3.0.0"
description = "Agente autónomo de ciberseguridad ofensiva para terminal"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OmniAgentCS" }]
keywords = ["security", "pentest", "red-team", "agent", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
]
# Runtime deps mirror nexus_core/requirements.txt + prompt_toolkit (TUI).
dependencies = [
    "openai>=1.109,<2",
    "pydantic>=2.13.4,<3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "google-genai>=1.30,<2",
    "msgpack>=1.2.1,<2",
    "sliver-py>=0.0.19",
    "psycopg[binary]==3.3.4",
    "prompt_toolkit>=3.0,<4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.4"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7", "pytest-cov>=5.0.0", "ruff>=0.6,<1"]

[project.scripts]
omni = "omni:main"

[project.urls]
Homepage = "https://github.com/bajioware/omni-agentcs"

[tool.setuptools]
# Top-level entry points installed as importable modules.
py-modules = ["omni", "nexus_worker"]

[tool.setuptools.packages.find]
include = ["nexus_core*"]
