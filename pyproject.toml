[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagentcs"
version = "3.0.0"
description = "Agente autónomo de ciberseguridad ofensiva para terminal"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OmniAgentCS" }]
keywords = ["security", "pentest", "red-team", "agent", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
]
# Runtime deps mirror nexus_core/requirements.txt + prompt_toolkit (TUI).
dependencies = [
    "openai>=1.109,<2",
    "pydantic>=2.13.4,<3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "google-genai>=1.30,<2",
    "msgpack>=1.2.1,<2",
    "sliver-py>=0.0.19",
    "psycopg[binary]==3.3.4",
    "prompt_toolkit>=3.0,<4",
    "rich>=13,<15",
    # Phase 3B: MCP client (official SDK; stdio + streamable HTTP transports).
    "mcp>=2.3,<3",
    # Phase 3B: OS-keyring backend for the secret store (config/secrets.py).
    "keyring>=25.7,<26",
    # Tool input contract enforcement (kernel/schema_validation.py, V1-10):
    # every keyword a catalog schema declares is enforced before the handler.
    "jsonschema>=4.23,<5",
    # Declarative playbooks (nexus_core/playbooks/*.yaml): the loader validates
    # each package with jsonschema and parses it with PyYAML. Without PyYAML the
    # engine degrades to its hand-written chains instead of failing a run.
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.4"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.6,<1",
    # Phase 3B: static type checking (see docs/missions/FASE3B_ECOSYSTEM.md §8).
    "mypy>=1.11,<3",
]

[project.scripts]
omni = "omni:main"

[project.urls]
Homepage = "https://github.com/bajioware/omni-agentcs"

[tool.mypy]
# Contrato de tipado del proyecto (V1-9). No silencia errores del código propio:
#   * ignore_missing_imports: las dependencias sin stubs (paramiko, pyspnego, sliver,
#     google-genai…) no aportan tipos; el código propio sí se comprueba.
#   * follow_imports = "skip": se comprueban los ficheros que se le pasan, que es lo
#     que hace el gate incremental `make typecheck`.
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.setuptools]
# Top-level entry points installed as importable modules.
py-modules = ["omni", "nexus_worker"]

[tool.setuptools.packages.find]
include = ["nexus_core*"]

[tool.setuptools.package-data]
# Non-Python files read at runtime through ``Path(__file__)``. Source-tree runs
# (the documented install: requirements + a symlink to omni.py) already have them;
# this keeps a wheel install from silently losing them.
#   * declarative playbook packages (nexus_core/playbooks/loader.py)
#   * binary install recipes (nexus_core/provisioner/recipes.py)
"nexus_core.playbooks" = ["*.yaml"]
"nexus_core.provisioner" = ["data/*.json"]

# Boundary DTOs must be checked against Pydantic's real types, even when the
# incremental gate skips unrelated repository imports.
[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*"]
follow_imports = "normal"

# Use pytest's published annotations for the strict regression-test gate.
[[tool.mypy.overrides]]
module = ["pytest", "pytest.*", "_pytest", "_pytest.*"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["rich", "rich.*", "prompt_toolkit", "prompt_toolkit.*"]
follow_imports = "normal"
